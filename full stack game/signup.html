<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>

<body>

    <h1>Create Account</h1>

    <form id="signupForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Sign Up</button>

    </form>

    <p id="message"></p>

    <script type="module" src="auth.js"></script>

</body>
</html>
